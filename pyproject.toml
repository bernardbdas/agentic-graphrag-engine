[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-graphrag-engine"
version = "0.1.0"
description = "Autonomous Multi-Agent GraphRAG & Financial Intelligence Engine for SEC Filings and Complex Knowledge Graphs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bernard Birendra Das", email = "bernardbdas@users.noreply.github.com" },
]
license = "Apache-2.0"
keywords = ["graphrag", "multi-agent", "langgraph", "neo4j", "qdrant", "colbert", "fintech", "llm"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "neo4j>=5.24.0",
    "qdrant-client>=1.11.0",
    "ragatouille>=0.0.8",
    "sentence-transformers>=3.1.0",
    "dspy-ai>=2.5.0",
    "sglang>=0.3.0; sys_platform == 'linux'",
    "httpx>=0.27.2",
    "redis>=5.1.0",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "click>=8.1.7",
]

[project.scripts]
graphrag = "src.cli:main"
agentic-graphrag = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
